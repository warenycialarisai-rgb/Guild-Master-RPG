<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Forest — Guild Master RPG</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    html, body { margin:0; padding:0; width:800px; height:600px; overflow:hidden; background:#0a1216; color:#edd8a6; }
    #phaser-game {position:relative;width:800px;height:600px;margin:0;}
    #phaser-game canvas {display:block;}
    [hidden] {display:none!important;}
    #guild-battle-panel {position:fixed;left:0;bottom:0;width:800px;height:209px;box-sizing:border-box;z-index:900;
      background:#152129;border-top:4px solid #ad8551;color:#eee1c3;font-family:Verdana,Arial,sans-serif;
      box-shadow:0 -9px 25px #050a0d9c;padding:12px 17px;}
    .guild-battle-head {display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;}
    .guild-battle-kicker,.guild-battle-label {font:700 12px Consolas,monospace;letter-spacing:1.4px;color:#e6b874;}
    #guild-battle-prompt {font-size:14px;}
    .guild-battle-content {display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;}
    .guild-battle-content>div {min-width:0;border:1px solid #48535b;background:#203039;padding:7px 9px;min-height:124px;}
    .guild-battle-label {font-size:10px;margin-bottom:6px;}
    .guild-unit {display:flex;justify-content:space-between;gap:4px;padding:4px 0;font-size:11px;border-bottom:1px solid #394850;}
    .guild-unit small {font-size:10px;color:#b0e1ba;white-space:nowrap;}
    .guild-unit-fallen {opacity:.5;text-decoration:line-through;}
    .guild-command {border:1px solid #a4895f;background:#3c4b53;color:#f9e9c8;border-radius:3px;padding:7px 10px;
      font:700 12px Verdana,Arial,sans-serif;cursor:pointer;text-align:left;width:100%;margin:3px 0;}
    .guild-command:hover:not(:disabled),.guild-command:focus-visible {background:#586b72;outline:2px solid #d7b276;}
    .guild-command:disabled {opacity:.45;cursor:default;}
    .guild-command-primary {background:#906f3d;border-color:#d1a766;color:#fff;min-height:40px;text-align:center;}
    #guild-battle-targets {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;max-height:105px;overflow-y:auto;}
    .guild-command-target {font-size:10px;padding:6px;margin:0;line-height:1.3;overflow-wrap:anywhere;}
    .guild-action-hint {font:11px/1.4 Verdana,Arial,sans-serif;color:#c4d0cb;margin:6px 0 0;}
    #guild-encounter-curtain {position:fixed;inset:0;z-index:1200;background:rgba(5,10,15,.87);display:flex;
      align-items:center;justify-content:center;font-family:Verdana,Arial,sans-serif;}
    .guild-encounter-card {background:#1c2a33;border:2px solid #b28c55;padding:28px 34px;width:480px;max-width:90%;
      box-shadow:0 16px 55px #000b;text-align:center;}
    .guild-encounter-card h2 {color:#f5d9a5;font:28px Georgia,serif;margin:12px 0;}
    .guild-encounter-card p {font-size:14px;line-height:1.65;color:#d5ddd8;margin:10px 0 23px;}
    #guild-encounter-start {border:1px solid #d2a96a;background:#916e3e;color:#fff7e5;padding:14px 28px;
      font:700 15px Verdana,Arial,sans-serif;cursor:pointer;}
    #guild-encounter-start:hover {background:#b18c52;}
    /* World interactions: shown only near a visible enemy. */
    #guild-explore-prompt {position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
      z-index:600;background:#172a27e8;border:2px solid #d0ac6b;color:#fff0c7;
      padding:11px 19px;font:bold 15px Verdana,Arial,sans-serif;pointer-events:none;
      box-shadow:0 6px 25px #080b0bdd;white-space:nowrap;}
    #guild-field-encounter {position:fixed;inset:0;z-index:1190;display:flex;align-items:center;
      justify-content:center;background:rgba(5,12,14,.87);font-family:Verdana,Arial,sans-serif;}
    .guild-field-buttons {display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .guild-field-buttons button {border:1px solid #c9ac77;background:#856639;color:#fff4d9;
      padding:13px 18px;font:700 15px Verdana,Arial,sans-serif;cursor:pointer;}
    .guild-field-buttons button:last-child {background:#354750;border-color:#7d9698;}
    .guild-field-buttons button:hover {filter:brightness(1.25);}
    #guild-combat-message {position:absolute;top:-35px;left:0;right:0;
      background:#1e3339d9;border-bottom:1px solid #9c8258;color:#f2e5c3;
      text-align:center;font:bold 13px Verdana,Arial,sans-serif;line-height:30px;
      min-height:0;pointer-events:none;}
    #guild-combat-message:empty {display:none;}
    #phaser-game canvas {image-rendering:pixelated;filter:brightness(1.12) saturate(1.25);}
  </style>
  <script>
    // El leaderboard remoto original no debe comunicarse con un servidor externo.
    (() => {
      const original = window.fetch.bind(window);
      window.fetch = (input, init) => {
        const address = typeof input === 'string' ? input : (input && input.url) || '';
        if (address.startsWith('https://us-central1-js-capstone-backend.cloudfunctions.net/api/games/')) {
          return Promise.resolve(new Response(JSON.stringify({result:[]}),
            {status:200, headers:{'Content-Type':'application/json'}}));
        }
        return original(input, init);
      };
    })();
  </script>
  <script src="project.bundle.js" defer></script>
  <script src="bridge.js" defer></script>
</head>
<body><div id="phaser-game"></div></body>
</html>
